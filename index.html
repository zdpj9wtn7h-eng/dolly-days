<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dolly Days</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f9dce9}body{display:flex;align-items:center;justify-content:center}button{font:inherit;border:0;padding:0}#game{position:relative;flex:none;width:1512px;height:982px;transform-origin:center;overflow:hidden;user-select:none;touch-action:none}#scene{position:absolute;width:1512px;height:982px;pointer-events:none}#tools{position:absolute;inset:0;pointer-events:none}.tool,.sprite{position:absolute;background-repeat:no-repeat;background-size:1512px 982px}.tool{background-color:transparent;pointer-events:none}.tool.active{pointer-events:auto;cursor:pointer;animation:glow 1s ease-in-out infinite alternate}.tool.done{filter:grayscale(1) brightness(1.15);opacity:.85}.tool.held{animation:none;filter:drop-shadow(0 0 10px #fff)}#carried{position:absolute;pointer-events:none;z-index:5;transform-origin:50% 50%}#carried.working{animation:work .24s ease-in-out infinite alternate}#faceFx{position:absolute;left:-8px;top:300px;width:1050px;height:470px;pointer-events:none;z-index:6}#barFx{position:absolute;left:190px;top:274px;width:563px;height:34px;pointer-events:none;z-index:7}#next{position:absolute;left:1002px;top:714px;width:285px;height:96px;border-radius:52px;background:transparent;cursor:pointer;z-index:8}#next:disabled{cursor:default;background-image:url('assets/12.png');background-size:503px 170px;background-position:-127px -28px;background-repeat:no-repeat}#next:not(:disabled){animation:glow .85s ease-in-out infinite alternate}#next:not(:disabled):after{content:'';position:absolute;inset:4px;border-radius:50px;box-shadow:0 0 16px #fff,0 0 28px #ff73be;pointer-events:none}#game[data-held=true]{cursor:none}#game[data-held=true] .tool{cursor:none}[hidden]{display:none!important}@keyframes glow{from{filter:drop-shadow(0 0 3px white)}to{filter:drop-shadow(0 0 12px white) drop-shadow(0 0 9px #ff4cb4)}}@keyframes work{from{transform:translate(-7px,-3px) rotate(-5deg)}to{transform:translate(7px,3px) rotate(5deg)}}
/* 闪星独立于工具裁切，避免星星被 clip-path 截断。 */
#sparkles{position:absolute;pointer-events:none;z-index:4;overflow:visible}.star{position:absolute;font-family:Arial,sans-serif;color:#fff9ff;font-size:27px;line-height:1;text-shadow:0 0 4px white,0 0 10px #ff63c3;animation:twinkle 1.15s ease-in-out infinite;transform:translate(-50%,-50%)}@keyframes twinkle{0%,100%{opacity:.12;transform:translate(-50%,-50%) scale(.35) rotate(-15deg)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(15deg)}}
.page-button{position:absolute;z-index:10;border:0;background:transparent;cursor:pointer;border-radius:80px}#play{left:953px;top:776px;width:411px;height:135px}#complete{left:795px;top:649px;width:603px;height:138px;background:url('assets/16.png') -795px -649px / 1512px 982px no-repeat}.page-button:hover{filter:drop-shadow(0 0 9px white)}#showcase{position:absolute;left:60px;top:108px;width:1392px;height:756px;object-fit:cover;border-radius:30px;z-index:3;pointer-events:none}#showcase.final{left:50px;top:55px;width:1412px;height:875px;border-radius:35px}#game[data-mode=reveal] #faceFx{left:-493px;top:-80px;width:2500px;height:1050px;clip-path:inset(188px 555px 106px 553px round 26px)}
</style></head><body>
<main id="game" data-held="false" data-busy="false" aria-label="Dolly Days 改娃游戏"><img id="scene" src="assets/00.png" alt="改娃工作台" draggable="false"><div id="tools"></div><div id="carried" hidden></div><img id="faceFx" hidden alt="脸部特效"><img id="barFx" hidden alt="操作进度"><button id="next" aria-label="NEXT" disabled hidden></button><img id="showcase" hidden alt="娃娃展示动画"><button id="play" class="page-button" aria-label="PLAY" hidden></button><button id="complete" class="page-button" aria-label="COMPLETE" hidden></button></main>
<script src="game.js"></script></body></html>
